include:
  - backend/docker-compose.yml

volumes:
  uploads_volume_bp:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Vite dev proxy: use host-published port (works even if service DNS differs).
      #On native linux machines we change this to http://app:8080
      #On wsl we need to use http://host.docker.internal:8080
      API_PROXY_TARGET: http://host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - blueprint
    depends_on:
      app:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0
